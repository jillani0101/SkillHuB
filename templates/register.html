{% extends "base.html" %}
{% block title %}Sign Up — SkillHub{% endblock %}
{% block content %}
<div class="sh-auth-wrap">
    <div class="sh-auth">
        <div class="sh-auth-brand">{% include 'includes/_logo.html' %}</div>
        <div class="sh-auth-head">
            <h1>Create your account</h1>
            <p>Free forever. Connect with people who build.</p>
        </div>

        <div class="sh-form-card">
            <a class="sh-google-btn" href="{{ url_for('google_auth.login_google') }}">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.63h6.45a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.26-2.09 3.57-5.16 3.57-8.8z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3a7.16 7.16 0 0 1-10.7-3.77H1.36v3.1A12 12 0 0 0 12 24z"/>
                    <path fill="#FBBC05" d="M5.37 14.32a7.2 7.2 0 0 1 0-4.63v-3.1H1.36a12 12 0 0 0 0 10.77l4.01-3.04z"/>
                    <path fill="#EA4335" d="M12 4.8c1.76 0 3.35.61 4.6 1.8l3.42-3.43A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.36 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8z"/>
                </svg>
                Continue with Google
            </a>

            <div class="sh-divider">or sign up with email</div>

            <form method="post" class="sh-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="sh-field">
                    <label class="sh-label" for="username">Username <span class="req">*</span></label>
                    <input class="sh-input" type="text" id="username" name="username" minlength="3" maxlength="50" value="{{ form.username if form else '' }}" autocomplete="username" required>
                </div>
                <div class="sh-field">
                    <label class="sh-label" for="email">Email address <span class="req">*</span></label>
                    <input class="sh-input" type="email" id="email" name="email" value="{{ form.email if form else '' }}" autocomplete="email" required>
                </div>
                <div class="sh-field">
                    <label class="sh-label" for="password">Password <span class="req">*</span></label>
                    <input class="sh-input" type="password" id="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
                </div>
                <div class="sh-field">
                    <label class="sh-label" for="confirm_password">Confirm password <span class="req">*</span></label>
                    <input class="sh-input" type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                </div>
                <button class="sh-btn sh-btn-primary sh-btn-block" type="submit">Create Account</button>
            </form>

            <p class="text-sm text-muted mt-2" style="text-align:center;">
                Already have an account? <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
