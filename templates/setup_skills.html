{% extends "base.html" %}
{% block title %}Setup Skills — SkillHub{% endblock %}
{% block content %}
<div class="sh-container sh-main">
    <div class="mx-auto" style="max-width: 820px;">
        <h1 class="sh-page-title">Pick your skills</h1>
        <p class="sh-page-sub">Tell the community what you know — this helps match you with projects.</p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="sh-skill-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
                {% for skill in skills %}
                <label class="sh-skill-pick">
                    <input type="checkbox" name="skills" value="{{ skill.skill_id }}" {{ 'checked' if skill.skill_id in owned else '' }}>
                    <span>
                        {{ skill.skill_name }}
                        <select class="sh-skill-level" name="level_{{ skill.skill_id }}">
                            <option value="Beginner" {{ 'selected' if skill.skill_id in owned else '' }}>Beginner</option>
                            <option value="Intermediate" {{ 'selected' if skill.skill_id in owned else '' }}>Intermediate</option>
                            <option value="Expert" {{ 'selected' if skill.skill_id in owned else '' }}>Expert</option>
                        </select>
                    </span>
                </label>
                {% endfor %}
            </div>

            <div class="flex mt-3">
                <button class="sh-btn sh-btn-primary" type="submit" name="action" value="save">Save Skills</button>
                <button class="sh-btn sh-btn-ghost" type="submit" name="action" value="skip">Skip for now</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
