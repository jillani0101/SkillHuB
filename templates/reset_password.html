{% extends "base.html" %}
{% block title %}Set New Password — SkillHub{% endblock %}
{% block content %}
<div class="sh-auth-wrap">
    <div class="sh-auth">
        <div class="sh-auth-brand">
            <span class="sh-brand-icon">&#9889;</span> SkillHub
        </div>
        <div class="sh-auth-head">
            <h1>Set a new password</h1>
            <p>Choose a strong password for your account.</p>
        </div>

        <div class="sh-form-card">
            <form method="post" class="sh-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="sh-field">
                    <label class="sh-label" for="password">New password</label>
                    <input class="sh-input" type="password" id="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
                </div>
                <div class="sh-field">
                    <label class="sh-label" for="confirm_password">Confirm new password</label>
                    <input class="sh-input" type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                </div>
                <button class="sh-btn sh-btn-primary sh-btn-block" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
