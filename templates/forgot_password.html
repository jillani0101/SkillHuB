{% extends "base.html" %}
{% block title %}Forgot Password — SkillHub{% endblock %}
{% block content %}
<div class="sh-auth-wrap">
    <div class="sh-auth">
        <div class="sh-auth-brand">
            <span class="sh-brand-icon">&#9889;</span> SkillHub
        </div>
        <div class="sh-auth-head">
            <h1>Reset your password</h1>
            <p>Enter your email and we&rsquo;ll send you a reset link.</p>
        </div>

        <div class="sh-form-card">
            <form method="post" class="sh-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="sh-field">
                    <label class="sh-label" for="email">Email address</label>
                    <input class="sh-input" type="email" id="email" name="email" value="{{ form.email if form else '' }}" autocomplete="email" required>
                </div>
                <button class="sh-btn sh-btn-primary sh-btn-block" type="submit">Send Reset Link</button>
            </form>
            <p class="text-sm text-muted mt-2" style="text-align:center;">
                Remembered it? <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
